# lefthook config — https://lefthook.dev
pre-commit:
  # piped：串行执行——format 必须先于 typecheck/lint 落盘，否则检查的是未格式化的文件
  piped: true
  commands:
    format:
      # glob 与 prettier 默认支持范围对齐；不匹配任何 staged 文件时 piped 会因 skip 中断
      glob: "*.{js,mjs,cjs,ts,tsx,json,md,yaml,yml}"
      run: pnpm exec prettier --write {staged_files}
      # 格式化产物自动并入本次提交（无改动则零 diff）
      stage_fixed: true
    quality:
      run: pnpm typecheck && pnpm lint && pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
