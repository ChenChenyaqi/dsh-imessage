version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dsh-packages:
        patterns:
          - "@deepseek-ai/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # react 由 DSH 宿主平台注入（client/web 仍 ^18.2），跟随宿主，不单独升 major
      - dependencies: ["react", "react-dom", "@types/react"]
        update-types: ["version-update:major"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
