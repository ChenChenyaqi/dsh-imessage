name: Release

# 触发点：在 GitHub 上把 Release 从草稿发布（Publish release）。
# 草稿状态不触发；tag 由 gh release create / 网页创建 Release 时自动带上。
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing（OIDC）必需，不存任何长期 token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # npm Trusted Publishing 要求 npm >= 11.5.1；Node 22 自带的 npm 10 不够。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 版本号发出去就收不回（24h 后连 unpublish 都不行），先拦住不一致。
      - name: Verify version consistency
        run: node scripts/check-release-versions.mjs "${{ github.event.release.tag_name }}"

      - run: pnpm build

      # 用 npm publish 而非 pnpm publish：pnpm 的 OIDC 支持有已知故障
      # （pnpm#11513），而 pnpm publish 底层调的也是 npm。
      - name: Publish main package
        run: npm publish --provenance

      - name: Publish preset package
        run: npm publish --provenance ./preset

      # 刻意不在这里校验「npm view 能否查到」：npm 对已接受的发布会输出
      # "being processed and may take a few minutes"，传播延迟不确定。
      # 用可解析性判定成败只会误报，而误报会诱导人重跑本 job——
      # 重跑撞上「版本已存在」直接失败。npm publish 退出码 0 即发布成功。
