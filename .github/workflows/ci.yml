name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Stable check name for branch protection: the matrix expands to
  # "check (22)" / "check (24)", which change whenever the matrix does.
  # `always()` keeps this job from being skipped when a leg fails — a
  # skipped required check would leave PRs waiting instead of blocked.
  gate:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix legs passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "matrix result: ${{ needs.check.result }}"
            exit 1
          fi
          echo "all matrix legs passed"
